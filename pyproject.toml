[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediakit"
version = "1.0.0"
description = "照片压缩、视频切分/重组、拍摄时间修复"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anning" }]
keywords = ["photo", "video", "ffmpeg", "heif", "raw", "split", "merge", "exif"]
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.15",
    "rawpy>=0.19",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mediakit = "mediakit.cli:main"
vclip = "mediakit.cli:vclip_main"

[tool.setuptools.packages.find]
include = ["mediakit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
